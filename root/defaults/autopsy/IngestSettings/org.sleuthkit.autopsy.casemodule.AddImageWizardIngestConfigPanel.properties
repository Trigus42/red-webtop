#Default ingest profile for aarch64 Linux (GUI "Add Data Source" wizard context)
#Windows/x86-only modules are disabled so ingest runs without startup errors:
#  aLEAPP, iLEAPP, YARA (require Windows); Embedded File Extractor (7-Zip, no aarch64
#  native); Picture Analyzer (OpenCV 2.4.13, no aarch64 native).
Enabled_Ingest_Modules=Data Source Integrity, Extension Mismatch Detector, Hash Lookup, Encryption Detection, GPX Parser, PhotoRec Carver, Recent Activity, File Type Identification, Email Parser, Interesting Files Identifier
Disabled_Ingest_Modules=Keyword Search, Cyber Triage Malware Scanner, Plaso, YARA Analyzer, Android Analyzer (aLEAPP), iOS Analyzer (iLEAPP), Embedded File Extractor, Picture Analyzer, Virtual Machine Extractor, Central Repository, DJI Drone Analyzer, Android Analyzer
Last_File_Ingest_Filter=All Files, Directories, and Unallocated Space
