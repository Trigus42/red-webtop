###############################################################################
# red-webtop behind a Gluetun VPN sidecar (WireGuard + kill switch).
#
# Gluetun owns the network namespace; red-webtop shares it via
# `network_mode: service:gluetun`, so ALL of red-webtop's traffic is forced
# through the tunnel. If the tunnel drops, Gluetun's kill switch blocks
# everything — no leaks. Because red-webtop has no independent network stack
# here, its published ports are declared on the GLUETUN service instead, so the
# desktop/ssh/syncthing stay reachable on the host regardless of VPN state.
#
# Use this file instead of docker-compose.yaml:
#     docker compose -f docker-compose.gluetun.yaml up -d --build
#
# Setup:
#   1. mkdir -p vpn-configs
#   2. put your WireGuard config at vpn-configs/wg0.conf (wg-quick format)
#   3. bring the stack up (gluetun starts first; red-webtop waits for it)
###############################################################################
services:
  gluetun:
    image: ghcr.io/qdm12/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    volumes:
      # Place your wg0.conf in vpn-configs/ next to this file. Fields in the
      # file (keys, endpoint, addresses) are read automatically.
      - ./vpn-configs:/gluetun/wireguard:ro
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      # IPv6 through the tunnel — set to off if your provider doesn't support it.
      - VPN_IPV6=on
      # Kill switch: nothing outside the tunnel is allowed. Add comma-separated
      # CIDRs for local LAN access (e.g. 192.168.1.0/24).
      - FIREWALL_OUTBOUND_SUBNETS=
      # DNS via Gluetun's built-in DoT resolver (encrypted; no plain UDP leaks).
      # The `DNS =` line in wg0.conf is ignored — Gluetun manages DNS itself.
      - DNS_UPSTREAM_RESOLVER_TYPE=dot
      - DNS_UPSTREAM_RESOLVERS=quad9
    ports:
      # red-webtop's ports are published HERE (it shares gluetun's netns):
      - "3000:3000"    # KDE desktop over HTTP
      - "3001:3001"    # KDE desktop over HTTPS
      - "8384:8384"    # Syncthing web UI (when SYNCTHING_ENABLE=true)
      - "2222:22"      # SSH (when SSHD_ENABLE=true)
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
    restart: unless-stopped

  red-webtop:
    build:
      context: .
      dockerfile: Dockerfile
    image: red-webtop:latest
    container_name: red-webtop
    # Share Gluetun's network namespace — all traffic goes through the tunnel.
    network_mode: service:gluetun
    depends_on:
      - gluetun

    privileged: true          # DIND + gocryptfs (/dev/fuse)
    shm_size: "2gb"

    environment:
      - PUID=911
      - PGID=1000
      - TZ=Etc/UTC
      - SSHD_ENABLE=true
      - SYNCTHING_ENABLE=false
      - START_DOCKER=true
      # - GOCRYPTFS_PASSWORD=change-me

    volumes:
      - ./config:/config
      # - ./docker-data:/var/lib/docker
      # - ./host-unencrypted:/workspace/host-unencrypted

    # NOTE: no `ports:` here — they are declared on the gluetun service above.
    restart: unless-stopped
